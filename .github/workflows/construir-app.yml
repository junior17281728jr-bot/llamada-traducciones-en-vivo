# Construye los instaladores de Windows y de Mac. SIN PROBAR: este archivo se escribió sin poder ejecutarlo.
# Se lanza a mano desde la pestaña Actions de GitHub (Run workflow) o al crear una etiqueta v*.
# Los instaladores NO están firmados: Windows y Mac mostrarán un aviso al abrirlos (ver docs/EMPAQUETADO.md).
# Las acciones de terceros van fijadas a un commit (SHA) y no a una etiqueta que pueda moverse: para
# actualizarlas, cambia el SHA a mano tras revisar la nueva versión (el comentario indica la etiqueta).
name: Construir app de escritorio

on:
  workflow_dispatch: {}
  push:
    tags: ['v*']

jobs:
  construir:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Instalador de Windows
        if: matrix.os == 'windows-latest'
        run: npm run package:win -w @tw/desktop
      - name: Instalador de Mac
        if: matrix.os == 'macos-latest'
        run: npm run package:mac -w @tw/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: instalador-${{ matrix.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
          if-no-files-found: error
