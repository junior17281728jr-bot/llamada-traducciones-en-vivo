# Construye los instaladores de Windows y de Mac y los publica como versión "ultima" del repositorio,
# con enlaces de descarga directos (sin iniciar sesión en GitHub).
# Se lanza a mano desde la pestaña Actions (Run workflow) o al crear una etiqueta v*.
# Los instaladores NO están firmados: Windows y Mac mostrarán un aviso al abrirlos (ver docs/EMPAQUETADO.md).
name: Construir app de escritorio

on:
  workflow_dispatch: {}
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  construir:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Probar la voz del ordenador (plan B) en este sistema real
        run: node packages/pipeline/scripts/smoke-system-voice.mjs
      - name: Instalador de Windows
        if: matrix.os == 'windows-latest'
        run: npm run package:win -w @tw/desktop
      - name: Instalador de Mac
        if: matrix.os == 'macos-latest'
        run: npm run package:mac -w @tw/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ matrix.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
          if-no-files-found: error

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: instaladores
          merge-multiple: true
      - name: Publicar como versión "ultima"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ls -la instaladores
          cat > notas.md <<'NOTAS'
          Instaladores generados automáticamente (sin firmar).

          **Mac:** descarga el `.dmg` (`arm64` para chips Apple M1 o posteriores, `x64` para Intel) y arrastra la app a Aplicaciones.
          Como no está firmada por Apple, la primera vez macOS la bloquea. Dos formas de abrirla:
          1. Intenta abrirla, ve a Ajustes del Sistema > Privacidad y seguridad, baja hasta «Telecomway Traductor se bloqueó» y pulsa **Abrir de todos modos** (macOS 15); o clic derecho > Abrir (macOS 14 o anterior).
          2. Si dice «está dañada», abre Terminal y ejecuta: `xattr -cr "/Applications/Telecomway Traductor.app"` y vuelve a abrirla.

          **Windows:** descarga el `.exe`; si aparece el aviso de Windows, pulsa «Más información» > «Ejecutar de todas formas».

          La app es autónoma: no hace falta instalar nada más. Al abrirla, sigue la guía «Empezar» de la pantalla:
          pega tus claves de ElevenLabs y de Anthropic, elige los cables de audio y deja activada la entrada automática de WhatsApp.
          NOTAS
          gh release delete ultima --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create ultima instaladores/*.dmg instaladores/*.exe \
            -R "$GITHUB_REPOSITORY" \
            --title "Telecomway Traductor (última versión, sin firmar)" \
            --notes-file notas.md
