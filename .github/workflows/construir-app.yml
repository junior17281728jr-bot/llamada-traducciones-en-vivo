# Construye los instaladores de Windows y de Mac y los publica como versión "ultima" del repositorio,
# con enlaces de descarga directos (sin iniciar sesión en GitHub).
# Se lanza a mano desde la pestaña Actions (Run workflow) o al crear una etiqueta v*.
# Los instaladores NO están firmados: Windows y Mac mostrarán un aviso al abrirlos (ver docs/EMPAQUETADO.md).
name: Construir app de escritorio

on:
  workflow_dispatch: {}
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  construir:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Instalador de Windows
        if: matrix.os == 'windows-latest'
        run: npm run package:win -w @tw/desktop
      - name: Instalador de Mac
        if: matrix.os == 'macos-latest'
        run: npm run package:mac -w @tw/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ matrix.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
          if-no-files-found: error

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: instaladores
          merge-multiple: true
      - name: Publicar como versión "ultima"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ls -la instaladores
          cat > notas.md <<'NOTAS'
          Instaladores generados automáticamente (sin firmar).

          **Mac:** descarga el `.dmg` (`arm64` para chips Apple M1 o posteriores, `x64` para Intel), arrastra la app a Aplicaciones y ábrela con clic derecho > Abrir.

          **Windows:** descarga el `.exe`; si aparece el aviso de Windows, pulsa «Más información» > «Ejecutar de todas formas».

          La app necesita el servidor en marcha (ver README).
          NOTAS
          gh release delete ultima --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create ultima instaladores/*.dmg instaladores/*.exe \
            -R "$GITHUB_REPOSITORY" \
            --title "Última versión de prueba (sin firmar)" \
            --notes-file notas.md
